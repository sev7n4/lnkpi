<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1050" width="760" height="1050" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="760" height="1050" fill="#f4f6f9"/>

  <!-- ============ 面板外框 ============ -->
  <rect x="40" y="40" width="600" height="830" rx="14" fill="#ffffff" stroke="#d7dce5"/>

  <!-- 头部 40..88 -->
  <path d="M40 54a14 14 0 0 1 14-14h572a14 14 0 0 1 14 14v34H40z" fill="#fafbfd"/>
  <line x1="40" y1="88" x2="640" y2="88" stroke="#e3e7ee"/>
  <rect x="58" y="54" width="22" height="22" rx="6" fill="#e8f0fd" stroke="#c9dcf8"/>
  <text x="92" y="71" fill="#1f2530" font-size="14" font-weight="700">精修</text>
  <path d="M604 60l12 12M616 60l-12 12" fill="none" stroke="#7c8595" stroke-width="1.7" stroke-linecap="round"/>

  <!-- 对照带 88..174 -->
  <text x="58" y="112" fill="#1f2530" font-size="13" font-weight="650">对照预览</text>
  <text x="132" y="112" fill="#7c8595" font-size="11">固定 · 默认左右</text>
  <rect x="588" y="98" width="26" height="26" rx="8" fill="#ffffff" stroke="#d7dce5"/>
  <path d="M602 105v4.5M597 110h4.5M602 120v-4.5M597 115h-4.5" fill="none" stroke="#4d5666" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="58" y="126" width="524" height="34" rx="10" fill="#fafbfd" stroke="#e3e7ee" stroke-dasharray="3 3"/>
  <text x="320" y="147" fill="#7c8595" font-size="11" text-anchor="middle">Before ／ After · 待生成</text>
  <line x1="40" y1="174" x2="640" y2="174" stroke="#e3e7ee"/>
  <text x="58" y="191" fill="#a3abba" font-size="10.5">↑ 本图不展开：沿用现状（固定带，不随滚动）</text>

  <!-- ============ ① 选择方式 ============ -->
  <text x="58" y="220" fill="#7c8595" font-size="11">选择方式（作用于全部 7 个工具）</text>
  <rect x="58" y="228" width="524" height="42" rx="11" fill="#ffffff" stroke="#d7dce5"/>
  <rect x="58" y="228" width="262" height="42" rx="11" fill="#e8f0fd" stroke="#1a6fd4"/>
  <text x="189" y="254" fill="#1a6fd4" font-size="13" font-weight="700" text-anchor="middle">加选</text>
  <text x="451" y="254" fill="#4d5666" font-size="13" text-anchor="middle">减选</text>
  <text x="58" y="288" fill="#7c8595" font-size="11">加选 = 并集（加进已有选区）　·　减选 = 差集（从已有选区挖掉）</text>
  <text x="58" y="306" fill="#7c8595" font-size="11">拨到「减选」后，矩形 / 椭圆 / 多边形 / 魔棒 / 点选 也按减选执行</text>

  <!-- ============ ② 工具 ============ -->
  <text x="58" y="342" fill="#7c8595" font-size="11">工具</text>

  <!-- 智能选择 -->
  <text x="58" y="375" fill="#4d5666" font-size="12">智能选择</text>
  <g transform="translate(146 358)">
    <rect x="0" y="0" width="88" height="34" rx="10" fill="#ffffff" stroke="#d7dce5"/>
    <g transform="translate(12 10) scale(0.583)" fill="none" stroke="#4d5666" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/><path d="M12 3.5a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17z"/>
    </g>
    <text x="34" y="22" fill="#4d5666" font-size="12">点选主体</text>
  </g>
  <g transform="translate(242 358)">
    <rect x="0" y="0" width="70" height="34" rx="10" fill="#ffffff" stroke="#d7dce5"/>
    <g transform="translate(12 10) scale(0.583)" fill="none" stroke="#4d5666" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 18.5 17 7.5"/><path d="M15.5 4.5l4 4"/><path d="M5 15.5l3.5 3.5"/><path d="M17.5 6.5l1 1"/>
    </g>
    <text x="34" y="22" fill="#4d5666" font-size="12">魔棒</text>
  </g>

  <!-- 形状 -->
  <text x="58" y="417" fill="#4d5666" font-size="12">形状</text>
  <g transform="translate(146 400)">
    <rect x="0" y="0" width="62" height="34" rx="10" fill="#e8f0fd" stroke="#1a6fd4"/>
    <g transform="translate(12 10) scale(0.583)" fill="none" stroke="#1a6fd4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5.5h16v13H4z"/>
    </g>
    <text x="34" y="22" fill="#1a6fd4" font-size="12" font-weight="600">矩形</text>
  </g>
  <g transform="translate(216 400)">
    <rect x="0" y="0" width="62" height="34" rx="10" fill="#ffffff" stroke="#d7dce5"/>
    <g transform="translate(12 10) scale(0.583)" fill="none" stroke="#4d5666" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 12a8.5 6.5 0 1 0 17 0 8.5 6.5 0 1 0-17 0z"/>
    </g>
    <text x="34" y="22" fill="#4d5666" font-size="12">椭圆</text>
  </g>
  <g transform="translate(286 400)">
    <rect x="0" y="0" width="76" height="34" rx="10" fill="#ffffff" stroke="#d7dce5"/>
    <g transform="translate(12 10) scale(0.583)" fill="none" stroke="#4d5666" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5l8.5 6.2-3.2 10H6.7L3.5 9.7z"/>
    </g>
    <text x="34" y="22" fill="#4d5666" font-size="12">多边形</text>
  </g>
  <text x="374" y="421" fill="#b07b1e" font-size="11">← 新增</text>

  <!-- 涂抹修边 -->
  <text x="58" y="459" fill="#4d5666" font-size="12">涂抹修边</text>
  <g transform="translate(146 442)">
    <rect x="0" y="0" width="62" height="34" rx="10" fill="#ffffff" stroke="#d7dce5"/>
    <g transform="translate(12 10) scale(0.583)" fill="none" stroke="#4d5666" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 19.5l3.8-.7L19.2 8.4a1.7 1.7 0 0 0 0-2.4l-1.2-1.2a1.7 1.7 0 0 0-2.4 0L5.7 15.2z"/><path d="M14.8 6.6l2.6 2.6"/>
    </g>
    <text x="34" y="22" fill="#4d5666" font-size="12">画笔</text>
  </g>
  <g transform="translate(216 442)">
    <rect x="0" y="0" width="62" height="34" rx="10" fill="#ffffff" stroke="#d7dce5"/>
    <g transform="translate(12 10) scale(0.583)" fill="none" stroke="#4d5666" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 15.2l7.4-7.4a1.6 1.6 0 0 1 2.3 0l3.9 3.9a1.6 1.6 0 0 1 0 2.3L13.5 19H8.6z"/><path d="M5 19.5h14.5"/>
    </g>
    <text x="34" y="22" fill="#4d5666" font-size="12">橡皮</text>
  </g>
  <text x="296" y="463" fill="#7c8595" font-size="11">（画笔 = 加选快捷态 · 橡皮 = 减选快捷态）</text>

  <!-- ============ ③ 参数 ============ -->
  <text x="58" y="498" fill="#7c8595" font-size="11">当前工具参数（固定位置，随工具切换内容）</text>
  <text x="58" y="518" fill="#1f2530" font-size="12.5" font-weight="650">当前工具 · 画笔</text>

  <rect x="58" y="528" width="524" height="72" rx="11" fill="#fafbfd" stroke="#e3e7ee"/>
  <text x="74" y="551" fill="#4d5666" font-size="12">粗细</text>
  <line x1="118" y1="547" x2="474" y2="547" stroke="#d7dce5" stroke-width="3" stroke-linecap="round"/>
  <line x1="118" y1="547" x2="250" y2="547" stroke="#1a6fd4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="250" cy="547" r="7" fill="#ffffff" stroke="#1a6fd4" stroke-width="2"/>
  <text x="486" y="552" fill="#1f2530" font-size="12">24</text>
  <text x="74" y="583" fill="#4d5666" font-size="12">颜色</text>
  <rect x="118" y="571" width="24" height="20" rx="6" fill="#ffd24a" stroke="#b6bec9"/>
  <text x="152" y="586" fill="#7c8595" font-size="11">选区在画布上的显示色</text>

  <text x="58" y="622" fill="#7c8595" font-size="11">用法提示（恒有一行，随工具变）</text>
  <rect x="58" y="630" width="524" height="28" rx="9" fill="#ffffff" stroke="#d7dce5" stroke-dasharray="3 3"/>
  <text x="74" y="649" fill="#4d5666" font-size="11.5">按住拖拽涂抹加选（跟随「选择方式」）</text>

  <text x="58" y="678" fill="#7c8595" font-size="11">其余形态：魔棒 → 容差滑杆　·　矩形 / 椭圆 / 多边形 / 点选 → 无参数（仅上方提示行）</text>

  <!-- ============ ④ 选区操作 ============ -->
  <text x="58" y="706" fill="#7c8595" font-size="11">选区操作</text>
  <rect x="58" y="714" width="256" height="34" rx="10" fill="#ffffff" stroke="#d7dce5"/>
  <text x="186" y="736" fill="#4d5666" font-size="12.5" text-anchor="middle">反选</text>
  <rect x="326" y="714" width="256" height="34" rx="10" fill="#ffffff" stroke="#d7dce5"/>
  <text x="454" y="736" fill="#4d5666" font-size="12.5" text-anchor="middle">清除选区</text>

  <!-- 滚动区结束 -->
  <line x1="40" y1="758" x2="640" y2="758" stroke="#e3e7ee"/>

  <!-- dock 758..810 -->
  <rect x="41" y="758" width="598" height="52" fill="#fafbfd"/>
  <rect x="58" y="770" width="524" height="30" rx="10" fill="#e8f0fd" stroke="#c9dcf8"/>
  <text x="320" y="790" fill="#1a6fd4" font-size="12" font-weight="600" text-anchor="middle">精修（生成到下游节点）</text>
  <line x1="40" y1="810" x2="640" y2="810" stroke="#e3e7ee"/>

  <!-- 固定页脚 810..870 -->
  <path d="M40 810h600v46a14 14 0 0 1-14 14H54a14 14 0 0 1-14-14z" fill="#ffffff"/>
  <rect x="58" y="824" width="30" height="20" rx="6" fill="#f4f6f9" stroke="#b6bec9"/>
  <text x="73" y="838" fill="#4d5666" font-size="10.5" text-anchor="middle">Esc</text>
  <text x="98" y="839" fill="#7c8595" font-size="11.5">关闭精修</text>
  <text x="226" y="839" fill="#a3abba" font-size="11">← 原模式条的这一行迁到这里</text>

  <!-- 标注 -->
  <circle cx="668" cy="249" r="13" fill="#ffffff" stroke="#1a6fd4" stroke-width="1.5"/>
  <text x="668" y="254" fill="#1a6fd4" font-size="12.5" font-weight="700" text-anchor="middle">1</text>
  <circle cx="668" cy="417" r="13" fill="#ffffff" stroke="#1a6fd4" stroke-width="1.5"/>
  <text x="668" y="422" fill="#1a6fd4" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
  <circle cx="668" cy="576" r="13" fill="#ffffff" stroke="#1a6fd4" stroke-width="1.5"/>
  <text x="668" y="581" fill="#1a6fd4" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
  <circle cx="668" cy="731" r="13" fill="#ffffff" stroke="#1a6fd4" stroke-width="1.5"/>
  <text x="668" y="736" fill="#1a6fd4" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
  <circle cx="668" cy="835" r="13" fill="#ffffff" stroke="#1a6fd4" stroke-width="1.5"/>
  <text x="668" y="840" fill="#1a6fd4" font-size="12.5" font-weight="700" text-anchor="middle">5</text>

  <!-- ============ 图例 ============ -->
  <line x1="40" y1="898" x2="720" y2="898" stroke="#d7dce5"/>
  <text x="40" y="926" fill="#1f2530" font-size="12" font-weight="700">图例</text>

  <circle cx="100" cy="922" r="9" fill="#ffffff" stroke="#1a6fd4" stroke-width="1.2"/>
  <text x="100" y="926" fill="#1a6fd4" font-size="10.5" font-weight="700" text-anchor="middle">1</text>
  <text x="116" y="926" fill="#4d5666" font-size="11.5">选择方式：加选 / 减选，作用于全部 7 个工具（本期新增的全局开关）</text>

  <circle cx="100" cy="946" r="9" fill="#ffffff" stroke="#1a6fd4" stroke-width="1.2"/>
  <text x="100" y="950" fill="#1a6fd4" font-size="10.5" font-weight="700" text-anchor="middle">2</text>
  <text x="116" y="950" fill="#4d5666" font-size="11.5">工具：三组共 7 枚（椭圆为新增），替代原 rail 的三个二级菜单</text>

  <circle cx="100" cy="970" r="9" fill="#ffffff" stroke="#1a6fd4" stroke-width="1.2"/>
  <text x="100" y="974" fill="#1a6fd4" font-size="10.5" font-weight="700" text-anchor="middle">3</text>
  <text x="116" y="974" fill="#4d5666" font-size="11.5">参数：固定位置，标题随工具变；控件按 3 种形态之一渲染</text>

  <circle cx="100" cy="994" r="9" fill="#ffffff" stroke="#1a6fd4" stroke-width="1.2"/>
  <text x="100" y="998" fill="#1a6fd4" font-size="10.5" font-weight="700" text-anchor="middle">4</text>
  <text x="116" y="998" fill="#4d5666" font-size="11.5">选区操作：反选 / 清除选区（原散在两个二级菜单里，现集中）</text>

  <circle cx="100" cy="1018" r="9" fill="#ffffff" stroke="#1a6fd4" stroke-width="1.2"/>
  <text x="100" y="1022" fill="#1a6fd4" font-size="10.5" font-weight="700" text-anchor="middle">5</text>
  <text x="116" y="1022" fill="#4d5666" font-size="11.5">固定页脚：Esc 提示，三态文案（关闭精修 / 回到选区 / 回到工作图）</text>
</svg>

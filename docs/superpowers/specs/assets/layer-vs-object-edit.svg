<svg viewBox="0 0 680 430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>图层分层与对象级编辑的差异</title>
<desc>左侧为像素图层树，编辑动作是几何变换、产物是组合渲染；右侧为单张整图加语义索引表，编辑动作是掩码加指令交给模型重画新图。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="40" width="280" height="340" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="66" font-size="14" font-weight="500" fill="#26215C">图层分层（PS 式）</text>
<text x="60" y="86" font-size="12" fill="#534AB7">像素被真正拆开 · 用户手工维护</text>
<rect x="60" y="102" width="240" height="44" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
<text x="180" y="124" font-size="13" fill="#26215C" text-anchor="middle" dominant-baseline="central">图层 3 · 文字</text>
<rect x="60" y="150" width="240" height="44" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
<text x="180" y="172" font-size="13" fill="#26215C" text-anchor="middle" dominant-baseline="central">图层 2 · 帽子</text>
<rect x="60" y="198" width="240" height="44" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
<text x="180" y="220" font-size="13" fill="#26215C" text-anchor="middle" dominant-baseline="central">图层 1 · 背景</text>
<text x="60" y="268" font-size="13" font-weight="500" fill="#26215C" dominant-baseline="central">编辑动作 = 几何变换</text>
<text x="60" y="288" font-size="12" fill="#534AB7" dominant-baseline="central">位移 · 缩放 · 透明度 · 混合模式</text>
<text x="60" y="310" font-size="12" fill="#534AB7" dominant-baseline="central">产物：组合渲染，可再分层导出</text>
<text x="60" y="332" font-size="12" fill="#534AB7" dominant-baseline="central">换色只能调色相，无法重画对象</text>
<rect x="360" y="40" width="280" height="340" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="380" y="66" font-size="14" font-weight="500" fill="#04342C">对象级编辑</text>
<text x="380" y="86" font-size="12" fill="#0F6E56">像素仍是一整张 · 模型自动推断</text>
<rect x="380" y="102" width="240" height="100" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<ellipse cx="432" cy="140" rx="30" ry="17" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 2"/>
<text x="472" y="140" font-size="12" fill="#04342C" dominant-baseline="central">掩码：帽子</text>
<text x="500" y="186" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">整图（不可拆分）</text>
<rect x="380" y="216" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="392" y="240" font-size="12" font-family="monospace" fill="#04342C" dominant-baseline="central">{ id, label, mask, bbox }</text>
<text x="392" y="260" font-size="12" fill="#0F6E56" dominant-baseline="central">文字对象另带 ocrText · 跨版本复用</text>
<line x1="500" y1="272" x2="500" y2="284" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="380" y="288" width="240" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="310" font-size="13" fill="#04342C" text-anchor="middle" dominant-baseline="central">掩码 + 指令 → 模型重画新图</text>
<text x="380" y="352" font-size="12" fill="#0F6E56" dominant-baseline="central">换色 / 去除 / 换文字都走这条路</text>
<text x="340" y="404" font-size="13" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">图层回答「这块像素怎么摆」 · 对象编辑回答「这是什么、能下什么指令」</text>
</svg>

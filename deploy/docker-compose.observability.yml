# Optional observability overlay — OTel Collector → Tempo (+ Grafana UI).
#
# Usage on CVM:
#   docker compose -f deploy/docker-compose.prod.yml \
#     -f deploy/docker-compose.observability.yml up -d
#
# Then in /opt/lnkpi/.env for agent-runtime:
#   LNKPI_OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
#   LNKPI_LANGSMITH_OTEL_ENABLED=true
#   # optional dev: LNKPI_LANGSMITH_API_KEY=... (disables OTEL_ONLY, also sends to LangSmith)
#
# Grafana UI (local only): http://127.0.0.1:3000 → Explore → Tempo

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: lnkpi-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    networks:
      - lnkpi
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    container_name: lnkpi-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - lnkpi-tempo-data:/var/tempo
    networks:
      - lnkpi

  grafana:
    image: grafana/grafana:11.3.0
    container_name: lnkpi-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - lnkpi
    depends_on:
      - tempo

  agent-runtime:
    environment:
      LNKPI_OTEL_EXPORTER_OTLP_ENDPOINT: ${LNKPI_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      LNKPI_LANGSMITH_OTEL_ENABLED: ${LNKPI_LANGSMITH_OTEL_ENABLED:-true}

volumes:
  lnkpi-tempo-data:

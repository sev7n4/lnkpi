# product_visual route gold set (Task 1)
# Run: pytest tests/test_product_visual_route.py
version: 1
meta:
  spec: docs/superpowers/specs/2026-08-10-ecommerce-product-visual-design.md

cases:
  - id: pv-explicit-01
    state:
      messages: [{ role: user, content: "帮我出主图和场景图" }]
      requested_skill_id: ecommerce-product-visual
      sidebar_attachments:
        - { kind: image, role: product, url: "https://a/product.jpg" }
    gold: { flow_mode: product_visual, reason: explicit_product_visual_skill }

  - id: pv-explicit-02
    state:
      messages:
        [
          {
            role: user,
            content: "这是保温杯实拍，出天猫主图、模特展示图、卖点图和推广海报",
          },
        ]
      requested_skill_id: ecommerce-product-visual
      sidebar_attachments:
        - { mediaType: image, role: product, url: "https://a/thermos.jpg" }
    gold: { flow_mode: product_visual, reason: explicit_product_visual_skill }

  - id: pv-intent-01
    state:
      messages: [{ role: user, content: "帮我出主图和场景图" }]
      sidebar_attachments:
        - { kind: image, role: product, url: "https://a/product.jpg" }
    gold: { flow_mode: product_visual, reason: product_photo_multi_visual_intent }

  - id: pv-intent-02
    state:
      messages:
        [
          {
            role: user,
            content: "用这张实拍出包装效果图和模特手持礼盒的送礼效果图",
          },
        ]
      sidebar_attachments:
        - { mediaType: image, role: product, url: "https://a/crab.jpg" }
    gold: { flow_mode: product_visual, reason: product_photo_multi_visual_intent }

  - id: pv-intent-03
    state:
      messages: [{ role: user, content: "帮我出一套电商推广图" }]
      sidebar_attachments:
        - { kind: image, role: product, url: "https://a/item.jpg" }
    gold: { flow_mode: product_visual, reason: product_photo_multi_visual_intent }

  - id: pv-atomic-neg-01
    state:
      messages: [{ role: user, content: "帮我生成一张蓝牙耳机主图" }]
      sidebar_attachments:
        - { mediaType: image, role: product, url: "https://a/product.jpg" }
    gold: { flow_mode: atomic_create, reason: sidebar_ref_atomic }

  - id: pv-atomic-neg-02
    state:
      messages: [{ role: user, content: "生成一张白底产品图" }]
      sidebar_attachments:
        - { mediaType: image, role: product, url: "https://a/product.jpg" }
    gold: { flow_mode: atomic_create }

  - id: pv-campaign-neg-01
    state:
      messages: [{ role: user, content: "天猫蓝牙耳机详情页营销方案" }]
    gold: { flow_mode: clarify_route }

  - id: pv-campaign-neg-02
    state:
      messages: [{ role: user, content: "详情页构图方案" }]
      requested_skill_id: enterprise-marketing-campaign
    gold: { flow_mode: campaign, reason: explicit_skill_orchestration }

  - id: pv-img2img-preserve-01
    state:
      messages:
        [
          {
            role: user,
            content: "@I1 模特 @I2 产品，让模特穿上，保持构图不变",
          },
        ]
      sidebar_mentioned_keys: [I1, I2]
      sidebar_attachments:
        - { mediaType: image, role: product, url: "https://a/1.jpg" }
        - { mediaType: image, url: "https://a/2.jpg" }
    gold: { flow_mode: atomic_create, reason: sidebar_img2img_p1 }

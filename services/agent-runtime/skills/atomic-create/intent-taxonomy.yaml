# P4 Atomic Studio Intent — routing & modality taxonomy
# Consumed by parse_atomic_intent + intake soft signals (P4-03+)
# Phase 2d.3: retired flow_mode routes removed from SSOT; soft hints renamed.
version: 1

routes:
  campaign:
    description: 营销方案全链路
    flow_mode: campaign
  chat:
    description: 无副作用闲聊
    flow_mode: campaign  # phase=done via chat node

target_types:
  image:
    node_type: image
    studio_tool: run_image_generation
    confirm_gate: false
    write_field: prompt
  text:
    node_type: text
    studio_tool: run_text_generation
    confirm_gate: false
    write_field: content
    notes: |
      纯脚本/广告词/口播稿写作 → text 节点。
      「基于文案/提示词/文本生成视频/图片」→ 输出 video/image，文案/提示词仅为来源描述。
      扩写类（提示词模式、分镜提示词、的提示词）→ prompt 节点。
  prompt:
    node_type: prompt
    studio_tool: run_prompt_generation
    confirm_gate: false
    write_field: prompt
    notes: |
      prompt 扩写/分镜提示词/三视图提示词等，且用户未要求生成视频/图片。
  audio:
    node_type: audio
    studio_tool: run_audio_generation
    confirm_gate: true
    write_field: content
  video:
    node_type: video
    studio_tool: run_video_generation
    confirm_gate: true
    write_field: prompt

# Soft-only documentation (not intake SSOT for retired lanes):
# - focus_node_id + focus_gen_intent → canvas_agent (precedence focus_gen)
# - atomic_node_id + atomic_spec + regen_intent → canvas_agent (checkpoint_regen)
# - utterance_suggests_media_create → soft media_create_high / canvas_agent isolation
intake_priority:
  - id: explicit_skill
    when: requested_skill_id is set
    route: campaign
    notes: Orchestration only via user-selected Skill (platform-route R-S1)
  - id: orchestration_clarify
    when: orchestration_complexity_intent == campaign and not requested_skill_id
    route: clarify_route
    notes: High-complexity utterance without Skill → clarify, not silent campaign
  - id: fallback
    when: default
    route: chat

media_create_hints:
  - 帮我生成
  - 帮我做一张
  - 生成一个
  - 生成一张
  - 做一个
  - 来一张
  - 来一段
  - 写一段
  - 配一段
  # Longer copy-create phrases only — bare 「文案」must not force atomic (canvas 文案节点 edits).
  - 生成文案
  - 写一段文案
  - 输出文案

text_default_keywords:
  - 分镜脚本
  - 脚本
  - 广告词
  # No bare 「文案」— substring matches canvas-edit utterances like 「看看画布文案节点」.
  - 口播稿

prompt_explicit_keywords:
  - prompt扩写
  - 提示词模式
  - 多模式扩写
  - 扩写prompt
  - 三视图提示词
  - 四视图提示词
  - 多视图提示词
  - 角色设定图提示词
  - 模特定妆图提示词

atomic_confirm_keywords:
  - 确认生成
  - 开始生成
  - 确认

atomic_regenerate_hints:
  - 再试一次
  - 再试
  - 重试
  - 重新生成
  - 重新生成一张
  - 重新生成一个
  - 再来一次
  - 再生成一次
  - 再跑一遍
  - 重复上一次操作
  - 重复上次
  - 重复上一步
  - 再来一遍
  - 再做一次
  - 重复上一操作

orchestration:
  max_atomic_multi_items: 5
  campaign_complexity_phrases:
    - 详情页方案
    - 全链路
    - 14节点
    - 整套分镜

pipelines:
  turnaround_image:
    description: 多视图 utterance 内部 character_turnaround 扩写后出图
    target_type: image
    prompt_mode: character_turnaround
    aspect_ratio: "2:1"
    resolution_bump_from_1k: true
    trigger_pattern: 三视图|四视图|多视图|turnaround|角色设定|模特定妆|正侧背|模特图

turnaround_image_keywords:
  - 三视图
  - 四视图
  - 多视图
  - turnaround
  - 角色设定
  - 模特定妆
  - 正侧背
  - 模特图
  - q版
  - chibi
  - 模特定妆图

# P4 Atomic Studio Intent — routing & modality taxonomy
# Consumed by parse_atomic_intent + intake routing (P4-03+)
version: 1

routes:
  atomic_create:
    description: 新建画布节点并提交 Studio 生产（单句原子闭环）
    flow_mode: atomic_create
  single_node:
    description: 已有节点快速再生（P3，需 focus_node_id）
    flow_mode: single_node
  campaign:
    description: 营销方案全链路
    flow_mode: campaign
  chat:
    description: 无副作用闲聊
    flow_mode: campaign  # phase=done via chat node

target_types:
  image:
    node_type: image
    studio_tool: run_image_generation
    confirm_gate: false
    write_field: prompt
  text:
    node_type: text
    studio_tool: run_text_generation
    confirm_gate: false
    write_field: content
    notes: |
      纯脚本/广告词/口播稿写作 → text 节点。
      「基于文案/提示词/文本生成视频/图片」→ 输出 video/image，文案/提示词仅为来源描述。
      扩写类（提示词模式、分镜提示词、的提示词）→ prompt 节点。
  prompt:
    node_type: prompt
    studio_tool: run_prompt_generation
    confirm_gate: false
    write_field: prompt
    notes: |
      prompt 扩写/分镜提示词/三视图提示词等，且用户未要求生成视频/图片。
  audio:
    node_type: audio
    studio_tool: run_audio_generation
    confirm_gate: true
    write_field: content
  video:
    node_type: video
    studio_tool: run_video_generation
    confirm_gate: true
    write_field: prompt

intake_priority:
  - id: campaign_override
    when: marketing_intent and not atomic_create_intent
    route: campaign
  - id: single_node
    when: focus_node_id and single_node_gen_intent and not modify_intent
    route: single_node
  - id: atomic_regenerate
    when: atomic_node_id and atomic_spec and atomic_regenerate_intent
    route: atomic_regenerate
    notes: Same-node retry only (no variant/adjust tail). Variant phrases route to atomic_create.
  - id: atomic_create
    when: atomic_create_intent and not marketing_intent
    route: atomic_create
  - id: orchestration_campaign
    when: orchestration_complexity_intent == campaign
    route: campaign
    notes: Overrides atomic_create for high-complexity storyboard / full-funnel requests
  - id: fallback
    when: default
    route: chat

atomic_create_hints:
  - 帮我生成
  - 帮我做一张
  - 生成一个
  - 生成一张
  - 做一个
  - 来一张
  - 来一段
  - 写一段
  - 配一段

text_default_keywords:
  - 分镜脚本
  - 脚本
  - 广告词
  - 文案
  - 口播稿

prompt_explicit_keywords:
  - prompt扩写
  - 提示词模式
  - 多模式扩写
  - 扩写prompt
  - 三视图提示词
  - 四视图提示词
  - 多视图提示词
  - 角色设定图提示词
  - 模特定妆图提示词

atomic_confirm_keywords:
  - 确认生成
  - 开始生成
  - 确认

atomic_regenerate_hints:
  - 再试一次
  - 再试
  - 重试
  - 重新生成
  - 重新生成一张
  - 重新生成一个
  - 再来一次
  - 再生成一次
  - 再跑一遍
  - 重复上一次操作
  - 重复上次
  - 重复上一步
  - 再来一遍
  - 再做一次
  - 重复上一操作

orchestration:
  max_atomic_multi_items: 5
  campaign_complexity_phrases:
    - 详情页方案
    - 全链路
    - 14节点
    - 整套分镜

pipelines:
  turnaround_image:
    description: 多视图 utterance 内部 character_turnaround 扩写后出图
    target_type: image
    prompt_mode: character_turnaround
    aspect_ratio: "2:1"
    resolution_bump_from_1k: true
    trigger_pattern: 三视图|四视图|多视图|turnaround|角色设定|模特定妆|正侧背|模特图

turnaround_image_keywords:
  - 三视图
  - 四视图
  - 多视图
  - turnaround
  - 角色设定
  - 模特定妆
  - 正侧背
  - 模特图
  - q版
  - chibi
  - 模特定妆图

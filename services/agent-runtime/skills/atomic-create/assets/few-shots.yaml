        {"action":"unknown","scope":"unknown","route":"chat","structure":"single","items":[],"confidence":0.35,"needs_clarify":true,"clarify_question":"你想生成什么？例如图片、文案或视频，以及具体主题。","reason":"缺少模态与主题"}

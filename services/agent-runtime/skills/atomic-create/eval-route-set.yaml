# Platform route_decide eval gold set (R1)
# Run: pytest tests/test_eval_route_set.py
version: 1
meta:
  spec: docs/superpowers/specs/2026-08-07-platform-route-skill-boundary-design.md

cases:
  - id: rt-img2img-01
    state:
      messages: [{ role: user, content: "@I1 模特 @I2 产品，让模特穿上，保持构图不变" }]
      sidebar_mentioned_keys: [I1, I2]
      sidebar_attachments:
        - { mediaType: image, url: "https://a/1.jpg" }
        - { mediaType: image, url: "https://a/2.jpg" }
    gold: { flow_mode: atomic_create, reason: sidebar_img2img_p1 }

  - id: rt-img2img-02
    state:
      messages: [{ role: user, content: "@I1 这个是模特图，@I2 这个是产品图，让模特穿上这件衣服。保持主图风格，背景，构图不变。" }]
    gold: { flow_mode: atomic_create }

  - id: rt-img2img-03
    state:
      messages: [{ role: user, content: "@I1 @I2 融合换装" }]
      sidebar_mentioned_keys: [I1, I2]
    gold: { flow_mode: atomic_create }

  - id: rt-preserve-01
    state:
      messages: [{ role: user, content: "保持主图风格、背景、构图不变，生成换装图" }]
    gold: { flow_mode: atomic_create }

  - id: rt-preserve-02
    state:
      messages: [{ role: user, content: "保持构图不变，按 @I1 出图" }]
      sidebar_mentioned_keys: [I1]
    gold: { flow_mode: atomic_create }

  - id: rt-atomic-01
    state:
      messages: [{ role: user, content: "帮我生成一张蓝牙耳机主图" }]
    gold: { flow_mode: atomic_create }

  - id: rt-atomic-02
    state:
      messages: [{ role: user, content: "帮我生成一个模特人物图" }]
    gold: { flow_mode: atomic_create }

  - id: rt-atomic-03
    state:
      messages: [{ role: user, content: "生成一张白底产品图" }]
    gold: { flow_mode: atomic_create }

  - id: rt-clarify-01
    state:
      messages: [{ role: user, content: "天猫蓝牙耳机详情页营销方案" }]
    gold: { flow_mode: clarify_route }

  - id: rt-clarify-02
    state:
      messages: [{ role: user, content: "请你帮我设计蓝牙耳机主图，详情页的构图方案" }]

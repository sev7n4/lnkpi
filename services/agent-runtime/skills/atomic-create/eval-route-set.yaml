    gold: { flow_mode: campaign }

  - id: rt-skill-campaign-02
    state:
      messages: [{ role: user, content: "详情页构图方案" }]
      requested_skill_id: enterprise-marketing-campaign
    gold: { flow_mode: campaign }

  - id: rt-chat-01
    state:
      messages: [{ role: user, content: "你好" }]
    gold: { flow_mode: chat }

  - id: rt-chat-02
    state:
      messages: [{ role: user, content: "这个音箱怎么样" }]
    gold: { flow_mode: chat }

  - id: rt-regen-01
    state:
      messages: [{ role: user, content: "重新生成一张" }]
      atomic_node_id: node-1
      atomic_spec: { target_type: image, prompt: x, title: x }
    gold: { flow_mode: atomic_regenerate }

  - id: rt-regen-clarify-01
    state:
      messages: [{ role: user, content: "重新生成一张" }]
    gold: { flow_mode: clarify_route, reason: regen_no_checkpoint }

  - id: rt-modify-01
    state:
      messages: [{ role: user, content: "把模特定妆改为双人模特" }]
      user_brief: 洁具方案
      plan_draft: "# plan"
    gold: { flow_mode: campaign, is_modify: true }

  - id: rt-single-01
    state:
      messages: [{ role: user, content: "快速生成" }]
      focus_node_id: image-1
    gold: { flow_mode: single_node }

  - id: rt-img2img-04
    state:
      messages: [{ role: user, content: "@I1 风格 @I2 产品，替换穿上" }]
      sidebar_mentioned_keys: [I1, I2]
